[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-vault"
version = "0.1.0"
description = "Turn a Prophet actuarial model (Firebird PRW + RCI workspace) into a searchable, linked, diffable knowledge base."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "prophet-vault contributors" }]
keywords = [
    "prophet",
    "actuarial",
    "firebird",
    "prw",
    "obsidian",
    "knowledge-base",
    "dependency-graph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
prophet-vault = "prophet_vault.cli:main"

[tool.setuptools]
packages = ["prophet_vault"]

[tool.setuptools.package-data]
prophet_vault = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
