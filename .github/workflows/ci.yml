name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest -o addopts="" -q

      - name: Build and verify the wheel ships its templates
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from prophet_vault import graph; assert graph.TEMPLATE_PATH.exists(), 'template missing from wheel'; print('template ok')"
          python -c "import prophet_vault, importlib.metadata as m; assert prophet_vault.__version__ == m.version('prophet-vault'), 'version mismatch'; print('version', prophet_vault.__version__)"

      - name: Smoke-test the CLI
        shell: bash
        run: |
          python -m prophet_vault --version
          python -m prophet_vault demo --out "$RUNNER_TEMP/smoke" --no-vault
