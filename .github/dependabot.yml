# Dependabot version updates are PAUSED: `open-pull-requests-limit: 0` is the documented
# way to switch updates off without deleting the configuration.
#
# Why: the bump PRs it opened (actions/checkout 4->7, actions/setup-python 5->7, ruff
# <0.16 -> <0.18) all failed CI in ways that need a log to diagnose, and the upgrades are
# optional. The project is stable on the versions pinned in pyproject.toml and
# .github/workflows/ci.yml, so upgrades should be deliberate, not weekly noise.
#
# To resume: raise the two limits (5 is a sensible value), then upgrade one dependency at a
# time and read the CI log before merging. Dependabot security alerts are configured
# separately (Settings -> Code security); this file only controls version updates.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
    groups:
      python-dev:
        patterns: ["pytest*", "ruff*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    # When updates are resumed, keep major action bumps manual: v4 -> v7 is the kind of
    # change that needs a CI log read, not a weekly PR.
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-major"]
